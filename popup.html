<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AI Meeting Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <h2>AI Meeting Assistant</h2>
    <p id="status-text">Status: Stopped</p>

    <!-- Controls: Start aur Stop Buttons -->
    <div class="button-group">
      <button id="start-btn" class="btn start">Start Meeting</button>
      <button id="stop-btn" class="btn stop" disabled>Stop Meeting</button>
    </div>
  </div>

  <!-- Popup ka logic sambhalne wali JavaScript file -->
  <script src="popup.js"></script>
</body>

</html>
